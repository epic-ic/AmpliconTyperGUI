name: Test and Lint
on:
  push:
    branches: [ main ]
  pull_request:
defaults:
  run:
    working-directory: ./amplicontyper-electron
jobs:
  lint-and-format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: amplicontyper-electron/.nvmrc
          cache: npm
          cache-dependency-path: amplicontyper-electron/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format
        run: npm run format:check
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version-file: amplicontyper-electron/.nvmrc
          cache: npm
          cache-dependency-path: amplicontyper-electron/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
      - name: Build AmpliconTyper executable
        run: ./pyinstaller/build_installer.sh
        working-directory: ./amplicontyper-installer
      - name: E2e test
        run: npm run test:e2e
      - name: Upload e2e error snapshots
        if: always() && hashFiles('amplicontyper-electron/test-results') != ''
        uses: actions/upload-artifact@v7
        with:
          name: E2e error snapshots
          path: amplicontyper-electron/test-results