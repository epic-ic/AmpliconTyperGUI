name: Build Installers
on:
  release:
    types: [ created ]
  push:
    branches: [ main, mrc-6979-electron-installer ]
  pull_request:
    paths:
      - 'amplicontyper-installer/**'
jobs:
  build-amplicontyper-installer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./amplicontyper-installer
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
      - name: Build executable
        run: ./pyinstaller/build_installer.sh
      - name: Test executable
        run: ./test/test_amplicontyper_executable.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: amplicontyper-dist
          path: ./amplicontyper-installer/dist
  build-electron-linux-installer:
    runs-on: ubuntu-latest
    needs: build-amplicontyper-installer
    defaults:
      run:
        working-directory: ./amplicontyper-electron
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download amplicontyper dist artifact
        uses: actions/download-artifact@v7
        with:
          name: amplicontyper-dist
          path: ./amplicontyper-installer
      - name: Install Node
        uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: amplicontyper-electron/package-lock.json
      - name: Install npm deps
        run: npm ci
      - name: Typescript build
        run: npm run build
      - name: Build Linux installer
        run: npm run build-installer:linux
      - name: Add installers to release (if there is one)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: amplicontyper-electron/dist/*.deb
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifacts (if not a release)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v7
        with:
          name: piranhanet-windows-installer-${{ github.run_number }}
                path: | # useful for local testing
                  piranha-apps/dist/*.exe
                  piranha-apps/installer-resources/*
                retention-days: 10
