on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'amplicontyper-installer/**'
defaults:
  run:
    working-directory: ./amplicontyper-installer

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install micromamba
        uses: mamba-org/setup-micromamba@v3
      - name: Build executable
        run: ./pyinstaller/build_installer.sh
      - name: Test executable
        run: ./test/test_amplicontyper_executable.sh